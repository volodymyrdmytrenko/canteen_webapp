<!doctype html>
<html lang="uk">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #dfe6ee;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #ecfdf5;
      --success-border: #bbf7d0;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .topbar a {
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .topbar a:hover {
      border-color: #c5d2e1;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .04);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
    }

    form.inline {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf2f7;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f8fafc;
    }

    input,
    select {
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    input[type='number'] {
      width: 120px;
    }

    button {
      min-height: 40px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .flash {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .kpi .box {
      background: #f8fafc;
      border: 1px solid #e5edf5;
      padding: 16px;
      border-radius: 12px;
    }

    .num {
      font-size: 28px;
      font-weight: 700;
      margin-top: 6px;
    }

    .empty {
      color: var(--muted);
      padding: 14px 0 4px;
    }

    .login-wrap {
      max-width: 420px;
      margin: 120px auto;
    }

    .login-wrap form {
      display: grid;
      gap: 18px;
    }

    .login-wrap button {
      margin-top: 6px;
    }

    .report-filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .topbar a.brand {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .topbar a.active {
      background: #F2D233;
      color: #000;
      font-weight: 800;
      border: 1px solid #e6c200;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
    }

    .topbar a.active:hover {
      background: #ffd84a;
      border-color: #d4b400;
    }
  </style>
</head>

<body>
  <div class="wrap">
    {% if session.get('operator_id') %}
    <div class="topbar">
      <a href="{{ url_for('main.index') }}" class="brand {% if active_page == 'index' %}active{% endif %}">KONSORT</a>
      <a href="{{ url_for('employees.employees_page') }}"
        class="{% if active_page == 'employees' %}active{% endif %}">Працівники</a>
      <a href="{{ url_for('reports.report_page') }}" class="{% if active_page == 'report' %}active{% endif %}">Звіт
        їдальня</a>
      <a href="{{ url_for('reports.factory_report_page') }}"
        class="{% if active_page == 'factory' %}active{% endif %}">Звіт завод</a>
      <a href="{{ url_for('auth.logout') }}">Вихід</a>
    </div>
    {% endif %}

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
    <div class="flash">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>

</html>
